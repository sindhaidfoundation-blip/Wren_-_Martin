name: iOS native build validation

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/ios-native-check.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator-build:
    name: Prebuild and compile iOS app
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo native configuration
        run: |
          npm run check:config
          npx expo-doctor

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Compile iOS Simulator app
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          PROJECT="$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$WORKSPACE"
          test -n "$PROJECT"
          # Read app schemes from the Xcode project, not the workspace, which also lists CocoaPods targets.
          SCHEME="$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; schemes=json.load(sys.stdin)["project"]["schemes"]; app_schemes=[s for s in schemes if not s.lower().startswith("pods") and "pods" not in s.lower()]; print(app_schemes[0] if app_schemes else "")')"
          test -n "$SCHEME"
          echo "Building app scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "Built simulator app: $APP_PATH"

      - name: Upload iOS Simulator build
        uses: actions/upload-artifact@v4
        with:
          name: wren-martin-ios-simulator-build
          path: ${{ runner.temp }}/DerivedData/Build/Products/Debug-iphonesimulator/**/*.app
          if-no-files-found: error
          retention-days: 14
