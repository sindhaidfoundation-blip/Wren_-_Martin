name: Android security check and debug build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Audit dependencies and build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check Expo project configuration
        run: npx expo-doctor

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Verify Android network permission is removed
        run: |
          if grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            echo "Unexpected INTERNET permission in Android manifest."
            exit 1
          fi

      - name: Build test-only debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload test APK (not for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-test-only
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
