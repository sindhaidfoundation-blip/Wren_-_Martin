name: Progress persistence tests

on:
  push:
    branches:
      - main
      - fix/lesson-detail-render-crashes
    paths:
      - "App.js"
      - "package.json"
      - "src/utils/progressStorage.js"
      - "tests/progressStorage.test.cjs"
      - ".github/workflows/progress-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "App.js"
      - "package.json"
      - "src/utils/progressStorage.js"
      - "tests/progressStorage.test.cjs"
      - ".github/workflows/progress-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run progress persistence tests
        run: npm test
