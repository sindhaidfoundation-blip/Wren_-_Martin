name: Build Android APK and compatibility tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Configure private Google Play upload signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/wren-martin-upload.jks
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          def block_bounds(source, label, after=0):
              pos = source.find(label, after)
              if pos < 0:
                  raise SystemExit(f"Could not find {label} block")
              opening = source.find("{", pos)
              depth = 0
              for i in range(opening, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return opening, i
              raise SystemExit(f"Unclosed {label} block")

          # Add a separate release signing config; keep debug signing unchanged.
          sign_open, sign_end = block_bounds(s, "signingConfigs {")
          if 'storeFile file("wren-martin-upload.jks")' not in s:
              release_config = '''
              release {
                  storeFile file("wren-martin-upload.jks")
                  storePassword System.getenv("ANDROID_UPLOAD_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_UPLOAD_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_UPLOAD_KEY_PASSWORD")
              }
          '''
              s = s[:sign_end] + release_config + s[sign_end:]

          build_open, build_end = block_bounds(s, "buildTypes {")
          release_open, release_end = block_bounds(s, "release {", build_open)
          release_block = s[release_open:release_end]
          import re
          if re.search(r"signingConfig\\s+signingConfigs\\.\\w+", release_block):
              release_block = re.sub(
                  r"signingConfig\\s+signingConfigs\\.\\w+",
                  "signingConfig signingConfigs.release",
                  release_block,
                  count=1,
              )
          else:
              brace = release_block.find("{") + 1
              release_block = release_block[:brace] + "\\n                signingConfig signingConfigs.release" + release_block[brace:]
          s = s[:release_open] + release_block + s[release_end:]
          p.write_text(s)
          PY
          rm -f android/app/wren-martin-upload.jks
          echo "Release signing configured from encrypted GitHub Actions secrets."

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build Android App Bundle for Play Store
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: wren-martin-play-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK for compatibility tests
        uses: actions/upload-artifact@v4
        with:
          name: wren-martin-compatibility-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  android-compatibility:
    name: Android API ${{ matrix.api-level }} install and launch
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 33, 35, 36]
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wren-martin-compatibility-test-apk
          path: app

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, cold launch and relaunch on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r app/app-release.apk
            adb logcat -c
            adb shell monkey -p com.grammar.master.wrenmartin 1
            sleep 45
            test -n "$(adb shell pidof com.grammar.master.wrenmartin)"
            adb shell am force-stop com.grammar.master.wrenmartin
            sleep 2
            adb shell monkey -p com.grammar.master.wrenmartin 1
            sleep 20
            test -n "$(adb shell pidof com.grammar.master.wrenmartin)"
            adb logcat -d -b all -t 10000 > android-api-${{ matrix.api-level }}-launch.log
            ! grep -Eq "FATAL EXCEPTION|Fatal signal|ReactNativeJS.*(Error|Invariant Violation)|Unable to load script" android-api-${{ matrix.api-level }}-launch.log

      - name: Upload Android API ${{ matrix.api-level }} launch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-launch-log
          path: android-api-${{ matrix.api-level }}-launch.log
          if-no-files-found: ignore
          retention-days: 14
