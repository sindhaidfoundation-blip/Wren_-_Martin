name: Build Android APK and compatibility tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/android-startup-diagnostics
    paths:
      - "**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo configuration
        run: |
          npm run check:config
          npx expo-doctor
      - name: Generate Android native project
        run: CI=1 npx expo prebuild --clean --platform android
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Upload APK for compatibility tests
        uses: actions/upload-artifact@v4
        with:
          name: wren-martin-compatibility-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  android-compatibility:
    name: Android API ${{ matrix.api-level }} install and launch
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api-level: [26, 29, 33, 35, 36]
    steps:
      - name: Checkout test scripts
        uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wren-martin-compatibility-test-apk
          path: app
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, cold launch and relaunch on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android-compat-smoke.sh ${{ matrix.api-level }}
      - name: Upload Android API ${{ matrix.api-level }} launch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-launch-log
          path: android-api-${{ matrix.api-level }}-launch.log
          if-no-files-found: ignore
          retention-days: 14

  android-foreground-stability:
    name: Android 2-hour foreground soak
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - name: Checkout test scripts
        uses: actions/checkout@v4
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: wren-martin-compatibility-test-apk
          path: app
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify app stays open for two hours in foreground
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android-foreground-stability.sh
      - name: Upload foreground stability diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-foreground-stability-diagnostics
          path: |
            android-foreground-stability.log
            android-foreground-memory.log
          if-no-files-found: ignore
          retention-days: 14
