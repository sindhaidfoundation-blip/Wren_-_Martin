name: Android release compatibility checks

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android compatibility APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The Expo SDK 57 CLI currently requests an unpublished optional peer version.
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
      # Exercise the learning app independently of ad-network availability.
      EXPO_PUBLIC_ADS_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate release configuration
        run: npm run check:config
      - name: Check Expo dependencies
        run: npx expo-doctor
      - name: Generate Android native project
        run: CI=1 npx expo prebuild --clean --platform android --non-interactive
      - name: Build unsigned release APK and App Bundle for validation
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Upload compatibility APK
        uses: actions/upload-artifact@v4
        with:
          name: wren-martin-compatibility-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned compatibility App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: wren-martin-compatibility-test-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  android-compatibility:
    name: Android API ${{ matrix.api-level }} install and launch
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api-level: [26, 29, 33, 35, 36]
    steps:
      - name: Check out smoke-test script
        uses: actions/checkout@v4
      - name: Download compatibility APK
        uses: actions/download-artifact@v4
        with:
          name: wren-martin-compatibility-test-apk
          path: app
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, cold launch, relaunch and inspect logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android-compat-smoke.sh ${{ matrix.api-level }}
      - name: Upload Android launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-launch-diagnostics
          path: android-api-${{ matrix.api-level }}-launch.log
          if-no-files-found: ignore
          retention-days: 14
