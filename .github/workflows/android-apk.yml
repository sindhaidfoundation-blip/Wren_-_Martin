name: Build Android APK and compatibility tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK for compatibility tests
        uses: actions/upload-artifact@v4
        with:
          name: wren-martin-compatibility-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  android-compatibility:
    name: Android API ${{ matrix.api-level }} install and launch
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 33, 35, 36]
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wren-martin-compatibility-test-apk
          path: app

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, cold launch and relaunch on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r app/app-release.apk
            adb logcat -c
            adb shell monkey -p com.grammar.master.wrenmartin 1
            sleep 45
            test -n "$(adb shell pidof com.grammar.master.wrenmartin)"
            adb shell am force-stop com.grammar.master.wrenmartin
            sleep 2
            adb shell monkey -p com.grammar.master.wrenmartin 1
            sleep 20
            test -n "$(adb shell pidof com.grammar.master.wrenmartin)"
            adb logcat -d -b all -t 10000 > android-api-${{ matrix.api-level }}-launch.log
            ! grep -Eq "FATAL EXCEPTION|Fatal signal|ReactNativeJS.*(Error|Invariant Violation)|Unable to load script" android-api-${{ matrix.api-level }}-launch.log

      - name: Upload Android API ${{ matrix.api-level }} launch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-launch-log
          path: android-api-${{ matrix.api-level }}-launch.log
          if-no-files-found: ignore
          retention-days: 14
