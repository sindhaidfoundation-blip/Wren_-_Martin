name: Build Android test APK for lesson crash fix

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Build and smoke-test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out crash-fix branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell monkey -p com.grammar.master.wrenmartin 1
            sleep 30
            test -n "$(adb shell pidof com.grammar.master.wrenmartin)"
            adb logcat -d -b all -t 10000 > android-launch.log
            ! grep -Eq "FATAL EXCEPTION|Fatal signal|ReactNativeJS.*(Error|Invariant Violation)|Unable to load script" android-launch.log

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: wren-martin-lesson-fix-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
